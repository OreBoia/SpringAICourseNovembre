# ============================================================
# Configurazione comune a tutti i profili
# Le proprietà del provider stanno nei file di profilo:
#   application-groq.properties   (default)
#   application-openai.properties
# Perché? Lo vediamo nella tappa 7 (Spring Boot Profiles).
# ============================================================

# Profilo attivo di default (si cambia con -Dspring-boot.run.profiles=...)
spring.profiles.active=groq

# Chiavi API dal file .env nella cartella del progetto (non va su Git: è in .gitignore).
# Copia .env.example in .env e incolla la chiave. "optional:": se il file manca l'app parte lo stesso
# e legge le chiavi dalle variabili d'ambiente (export GROQ_API_KEY=...).
spring.config.import=optional:file:.env[.properties]

# Nessun modello di embedding finché non serve (lo accende il profilo "rag", tappa 9).
# Senza questa riga: lo starter OpenAI e quello transformers creerebbero due EmbeddingModel
# e il modello locale (~80 MB) verrebbe caricato a ogni avvio.
spring.ai.model.embedding=none

# Tappa 6: SimpleLoggerAdvisor scrive richiesta e risposta a livello DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Mostra il messaggio delle ResponseStatusException nel corpo dell'errore
# (es. "Provider sconosciuto", "Esercizio da svolgere"). Di default Spring Boot mostra solo lo status.
spring.web.error.include-message=always
