# Soluzione Parte 3 — Esercizio Facile
# Copiare in src/main/resources/application-groq-veloce.properties e avviare con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq-veloce
# Il profilo "groq" NON è attivo insieme a questo: servono tutte le proprietà.
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.replay-reasoning-content=false
