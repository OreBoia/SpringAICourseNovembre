# Profilo "rag-multilingua": si aggiunge a "rag" per usare un modello di embedding addestrato anche sull'italiano.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq,rag,rag-multilingua
# Al primo avvio scarica ~135 MB (modello quantizzato + tokenizer), poi li tiene in cache.
#
# Perché: con il modello predefinito (all-MiniLM-L6-v2, quasi solo inglese) i punteggi delle domande
# pertinenti e di quelle fuori tema si sovrappongono e nessuna soglia funziona (vedi README, "Calibrazione").
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json
